<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE3EF"/>
      <stop offset="55%" stop-color="#F6E3FF"/>
      <stop offset="100%" stop-color="#E3ECFF"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#FFFFFF" opacity="0.7"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#C9A0C8" flood-opacity="0.35"/>
    </filter>
    <style>
      .float1 { animation: float 4s ease-in-out infinite; }
      .float2 { animation: float 5s ease-in-out infinite 1s; }
      .float3 { animation: float 6s ease-in-out infinite .5s; }
      .twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .twinkle.d1 { animation-delay: .8s; }
      .twinkle.d2 { animation-delay: 1.6s; }
      .wave { animation: wave 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 70% 90%; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      @keyframes twinkle { 0%,100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes wave { 0%,60%,100% { transform: rotate(0deg); } 10%,30% { transform: rotate(16deg); } 20%,40% { transform: rotate(-8deg); } }
      .title { font: 800 64px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #6B3A5B; }
      .sub { font: 600 24px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #9A6A8C; letter-spacing: 1px; }
      .tag { font: 700 18px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #FFFFFF; }
      .note { font: 600 17px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #7A5570; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)"/>

  <!-- clouds -->
  <g class="float2" fill="#FFFFFF" opacity="0.9">
    <ellipse cx="140" cy="300" rx="90" ry="30"/>
    <ellipse cx="195" cy="285" rx="55" ry="34"/>
    <ellipse cx="105" cy="288" rx="45" ry="26"/>
  </g>
  <g class="float3" fill="#FFFFFF" opacity="0.85">
    <ellipse cx="1060" cy="70" rx="80" ry="24"/>
    <ellipse cx="1100" cy="56" rx="48" ry="28"/>
    <ellipse cx="1025" cy="60" rx="38" ry="22"/>
  </g>

  <!-- sparkles -->
  <g fill="#F48FB1">
    <path class="twinkle" d="M90 70 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"/>
    <path class="twinkle d1" d="M640 40 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#B197FC"/>
    <path class="twinkle d2" d="M560 320 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" fill="#91A7FF"/>
    <path class="twinkle d1" d="M1140 300 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
  </g>

  <!-- hearts -->
  <g class="float1">
    <path d="M760 300 c-8 -14 -30 -10 -30 6 c0 14 20 24 30 32 c10 -8 30 -18 30 -32 c0 -16 -22 -20 -30 -6z" fill="#FFB3D1"/>
  </g>
  <g class="float3">
    <path d="M60 170 c-5 -9 -19 -6 -19 4 c0 9 13 15 19 20 c6 -5 19 -11 19 -20 c0 -10 -14 -13 -19 -4z" fill="#D0BFFF"/>
  </g>

  <!-- text -->
  <text x="110" y="150" class="title">Hi, I'm Janney</text>
  <text class="wave" x="560" y="150" font-size="60">👋</text>
  <text x="114" y="196" class="sub">Frontend Developer · crafting cute &amp; tidy UIs ✿</text>

  <!-- tech pills -->
  <g transform="translate(114 228)">
    <rect width="132" height="40" rx="20" fill="#3178C6"/>
    <text x="66" y="26" text-anchor="middle" class="tag">TypeScript</text>
    <rect x="146" width="98" height="40" rx="20" fill="#61C9E8"/>
    <text x="195" y="26" text-anchor="middle" class="tag">React</text>
    <rect x="258" width="82" height="40" rx="20" fill="#007FFF"/>
    <text x="299" y="26" text-anchor="middle" class="tag">MUI</text>
    <rect x="354" width="90" height="40" rx="20" fill="#F48FB1"/>
    <text x="399" y="26" text-anchor="middle" class="tag">Vite</text>
  </g>

  <!-- polaroid card -->
  <g transform="translate(850 105) rotate(5)" filter="url(#shadow)" class="float1">
    <rect width="230" height="190" rx="8" fill="#FFFFFF"/>
    <rect x="14" y="14" width="202" height="122" rx="4" fill="#2B2440"/>
    <!-- code window -->
    <circle cx="30" cy="28" r="5" fill="#FF6B8B"/>
    <circle cx="46" cy="28" r="5" fill="#FFD43B"/>
    <circle cx="62" cy="28" r="5" fill="#69DB7C"/>
    <rect x="28" y="48" width="70" height="8" rx="4" fill="#F48FB1"/>
    <rect x="104" y="48" width="50" height="8" rx="4" fill="#91A7FF"/>
    <rect x="42" y="66" width="110" height="8" rx="4" fill="#B197FC"/>
    <rect x="42" y="84" width="80" height="8" rx="4" fill="#63E6BE"/>
    <rect x="128" y="84" width="60" height="8" rx="4" fill="#FFD43B"/>
    <rect x="28" y="102" width="40" height="8" rx="4" fill="#F48FB1"/>
    <rect x="72" y="102" width="6" height="14" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>
    <text x="115" y="170" text-anchor="middle" class="note">&lt;Janney /&gt; ♡</text>
  </g>
  <!-- washi tape -->
  <rect x="905" y="88" width="90" height="26" rx="3" fill="#FFC9DE" opacity="0.85" transform="rotate(-8 950 101)"/>
</svg>
